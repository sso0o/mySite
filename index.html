---
layout: none
---
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6574442338402760" crossorigin="anonymous"></script>
</head>
<body>
  <main>
    <h1>{{ site.title }}</h1>
    <p class="intro">{{ site.description }}. 이곳에서 진행 중인 프로젝트들을 모아 소개합니다.</p>
    <div class="projects">
      {% for project in site.data.projects %}
      <a class="project-card" href="{{ project.url }}">
        <h2>{{ project.name }}</h2>
        <p>{{ project.description }}</p>
      </a>
      {% endfor %}
    </div>
  </main>
</body>
</html>
